name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves a project repo under /<repo>, so that is the prefix
      # every project is built for. Renaming the repo needs no edit here.
      BASE_PREFIX: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            sites/*/*/package-lock.json

      # Structural problems — a project that cannot export, or one that
      # hardcodes basePath — fail here in seconds rather than after every
      # project has been compiled.
      - name: Check every project
        run: node tools/build.mjs --check

      - name: Check the dashboard manifest is up to date
        run: node tools/manifest.mjs --check

      # Installs and compiles the dashboard and every project. Expect minutes.
      - name: Build
        run: node tools/build.mjs

      - name: Report what was built
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Path |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | \`$BASE_PREFIX/\` |" >> $GITHUB_STEP_SUMMARY
          for dir in _site/*/*/; do
            [ -f "$dir/index.html" ] || continue
            path=${dir#_site/}
            echo "| ${path%/} | \`$BASE_PREFIX/${path}\` |" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  # Pull requests build as a check but never publish, so a broken project fails
  # the PR instead of reaching a client's link.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
