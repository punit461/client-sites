name: Build and publish

# Publishing happens from one branch and one branch only: deploy.
#
# A merge into deploy is itself a push to deploy, so this covers both "merge the
# PR" and "push straight to it". Nothing else starts a run — not a push to main,
# not a feature branch, not opening or updating a pull request. Day-to-day work
# on main costs no Actions minutes and cannot touch the live site.
#
# To promote what is on main:
#     git checkout deploy && git merge main && git push
#
# There is deliberately no pull_request trigger. It was what made a build start
# on every push to any branch that had a PR open, and it bought no safety: the
# publish steps below only run after the build succeeds, so a broken build can
# never reach the live site anyway.
on:
  push:
    branches: [deploy]
  # Manual runs are allowed from any branch, but only deploy publishes — see the
  # guards on the publish steps. Useful for checking a branch builds in CI.
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves a project repo under /<repo>, so that is the prefix
      # every project is built for. Renaming the repo needs no edit here.
      BASE_PREFIX: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            sites/*/*/package-lock.json

      # Structural problems — a project that cannot export, one that hardcodes
      # basePath, a category named after a dashboard page — fail here in
      # seconds rather than after every project has been compiled.
      - name: Check every project
        run: node tools/build.mjs --check

      - name: Check the dashboard manifest is up to date
        run: node tools/manifest.mjs --check

      # Installs and compiles the dashboard and every project. Expect minutes.
      - name: Build
        run: node tools/build.mjs

      - name: Report what was built
        run: |
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Page | Path |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | \`$BASE_PREFIX/\` |" >> $GITHUB_STEP_SUMMARY
          for dir in _site/*/*/; do
            [ -f "$dir/index.html" ] || continue
            path=${dir#_site/}
            echo "| ${path%/} | \`$BASE_PREFIX/${path}\` |" >> $GITHUB_STEP_SUMMARY
          done

      # A manual run on another branch stops here: it proves the branch builds
      # without publishing it.
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/deploy'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/deploy'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/deploy'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
