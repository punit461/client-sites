name: Deploy demo sites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Validates every site.json and fails the PR if a TODO placeholder
      # or a missing business name would have shipped to a client.
      - name: Build
        run: node tools/build.mjs

      - name: Report what was built
        run: |
          echo "### Sites built" >> $GITHUB_STEP_SUMMARY
          for d in _site/*/; do
            slug=$(basename "$d")
            echo "- [$slug](${{ steps.pages.outputs.base_url || '' }}/$slug/)" >> $GITHUB_STEP_SUMMARY
          done

      - uses: actions/configure-pages@v5
        id: pages
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
